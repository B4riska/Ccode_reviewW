<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games List</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1, h2 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        table {
            width: 90%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        a {
            color: #ff6f61;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            width: 300px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        button {
            background: #ff6f61;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
            margin: 5px;
        }

        button:hover {
            background: #ff3b2f;
        }
    </style>
</head>
<body>
    <h1>Список Steam-игр</h1>

    <form method="post" action="/filter">
        <label for="min_price">Мин. цена:</label>
        <input type="text" name="min_price" id="min_price">

        <label for="max_price">Макс. цена:</label>
        <input type="text" name="max_price" id="max_price">

        <input type="hidden" name="free_games" value="0">

        <button type="submit">Сортировать</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Название</th>
                <th>Дата релиза</th>
                <th>Цена</th>
                <th>Разработчик</th>
                <th>Ссылка на игру</th>
            </tr>
        </thead>
        <tbody>
            {% for game in games %}
                <tr>
                    <td>{{ game[1] }}</td>  <!-- Название -->
                    <td>{{ game[2] }}</td>  <!-- Дата релиза -->
                    <td>{{ game[3] }}</td>  <!-- Цена -->
                    <td>{{ game[6] }}</td>  <!-- Разработчик -->
                    <td><a href="{{ game[9] }}" target="_blank">Перейти</a></td>  <!-- Ссылка на игру -->
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
