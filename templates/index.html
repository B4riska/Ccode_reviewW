<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Loading Example</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1, h2 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            width: 300px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        button {
            background: #ff6f61;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
            margin: 5px;
        }

        button:hover {
            background: #ff3b2f;
        }

        #loading {
            font-size: 18px;
            margin-top: 20px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>
    <h1>Коллектор игр в Steam</h1>
    <h2>Нажми на кнопку "Начать", и, немного подождав, нажми на кнопку "Просмотр"</h2>
    <button id="startButton">Начать</button>
    <div id="loading" style="display: none;">Загрузка... (может занять несколько минут)</div>
    <div id="result"></div>

    <button onclick="location.href='/db'">Просмотр</button>

    <script>
        $(document).ready(function() {
            var processing = false;

            $("#startButton").click(function() {
                if (!processing) {
                    processing = true;
                    $("#loading").show();

                    $.ajax({
                        type: 'POST',
                        url: '/start_process',
                        success: function(result) {
                            $("#loading").hide();
                            $("#result").text("Result: " + result);
                            processing = false;
                        },
                        error: function() {
                            $("#loading").hide();
                            $("#result").text("Error occurred");
                            processing = false;
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
